name: Backend CI

on:
  push:
    branches: [main, LautyGod]
  pull_request:
    branches: [main, LautyGod]

jobs:
  verify:
    name: Migraciones, RLS, Contrato y Seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite completa del Backend
        run: npm test
